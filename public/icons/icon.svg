<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a0f4a"/>
      <stop offset="50%" stop-color="#1a0533"/>
      <stop offset="100%" stop-color="#0d0120"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b44dff"/>
      <stop offset="100%" stop-color="#ff6b6b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#ff9900"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#accent)" stroke-width="8" opacity="0.4"/>
  
  <!-- Glowing circle -->
  <circle cx="256" cy="256" r="160" fill="url(#accent)" opacity="0.15"/>
  
  <!-- Gamepad Shape -->
  <path d="M160 210 C160 180, 352 180, 352 210 C370 240, 390 320, 360 350 C330 380, 300 330, 270 330 C256 330, 256 330, 242 330 C212 330, 182 380, 152 350 C122 320, 142 240, 160 210 Z" fill="url(#accent)" filter="drop-shadow(0 8px 24px rgba(180,77,255,0.5))"/>
  
  <!-- D-Pad -->
  <rect x="180" y="240" width="16" height="48" rx="8" fill="#ffffff"/>
  <rect x="164" y="256" width="48" height="16" rx="8" fill="#ffffff"/>
  
  <!-- Buttons -->
  <circle cx="330" cy="250" r="10" fill="url(#gold)"/>
  <circle cx="310" cy="270" r="10" fill="#44cc88"/>
  <circle cx="350" cy="270" r="10" fill="#44aaff"/>
  <circle cx="330" cy="290" r="10" fill="#ff4444"/>
</svg>
